<title>Dashboard SPX — Demonstração</title>
<meta name="description" content="Demonstração do Dashboard SPX: Backlog e PNR completos. SLA, DS e o restante na versão Premium.">
<style>
:root{
  --vinho:#7a1230; --vinho-2:#93203f; --vinho-3:#5c0d24;
  --vinho-4:#6a0f29; --vinho-txt:#7a1230; --acc:#d92b3f; --tint-p:#fde3e6; --av1:#a3495a;
  --fora:#efe4e5; --linha2:#f4eaeb; --track:#e8dfe0; --grid:#eee2e3; --chip-borda:#e7d9db;
  --grip:#d9cccf; --sep:#d8cbce; --chk-borda:#c9bcc0; --ring:#cfc5c8; --sep2:#cdbfc3;
  --t2:#4a3f43; --t3:#5d5155; --muted2:#8d8286; --chev:#b7abaf; --campo-bg:#fdfafa; --seg-bg:#f1e6e7;
  --row-atraso:#fdecee; --aviso-a:#fbeaec; --aviso-b:#fdf5f5; --aviso-borda:#f1d9dc; --toast-bg:#2a2226;
  --sp1:#4d0c20; --sp2:#6a1329; --sp3:#9a4152; --sp4:#e9d3d5; --feat-tx:#5c0d24;
  --amarelo-bg2:#fff8e6; --amarelo-borda:#f3dfa6; --pill-a:#fbd3d8; --glow-at:#fde7d2;

  --bg:#fbf3f3; --card:#ffffff; --linha:#f0e3e4;
  --texto:#2a2226; --muted:#7c7074;
  --verde:#1fa75a; --verde-bg:#d6f0df; --verde-tx:#17803f;
  --amarelo:#f3b13a; --amarelo-bg:#fdf1cf; --amarelo-tx:#a86f0a;
  --laranja:#ef8a1f;
  --vermelho:#e0364a; --vermelho-bg:#fbdadd; --vermelho-tx:#cf2c42;
  --roxo:#6a4fc2; --roxo-bg:#e9e3fa;
  --mono:ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fora);font-family:var(--sans);color:var(--texto)}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
#app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;overflow-x:hidden}
svg.i{width:1em;height:1em;flex:none;display:block}
svg.i.s{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.f{fill:currentColor;stroke:none}

/* ---------- splash ---------- */
.splash{min-height:100dvh;display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;
  background:linear-gradient(180deg,var(--sp1) 0%,var(--sp2) 38%,var(--sp3) 66%,var(--sp4) 88%,var(--bg) 100%);padding:34px 24px calc(28px + env(safe-area-inset-bottom));position:relative}
.logo-full{display:block;width:180px;max-width:78%;height:auto;margin:0 auto}
.logo-emb{display:block;width:50px;height:auto;flex:none}
.splash .logo-full{margin:14px auto 22px}
.splash h1{margin:6px 0 6px;font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.3px}
.splash .sub{font-size:20px;opacity:.9;font-weight:400}
.splash .tag{margin:26px 0 0;font-size:16.5px;line-height:1.35;opacity:.95;max-width:260px}
.splash .rota{position:absolute;left:0;right:0;top:calc(50% + 40px);height:150px;pointer-events:none}
.splash .feats{margin-top:auto;display:flex;width:100%;justify-content:space-between;padding:0 6px 22px}
.splash .feat{flex:1;font-size:13.5px;color:var(--feat-tx);line-height:1.2}
.splash .feat+.feat{border-left:1px solid rgba(90,15,36,.18)}
.splash .feat .bola{width:54px;height:54px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;color:#fff;font-size:26px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:999px;padding:17px 20px;font-size:17px;font-weight:700;color:#fff;
  background:linear-gradient(180deg,var(--vinho-2),var(--vinho));box-shadow:0 8px 18px rgba(122,18,48,.28)}
.btn.sec{background:var(--card);color:var(--vinho-txt);border:1.6px solid var(--vinho-txt);box-shadow:none}
.btn.verde{background:linear-gradient(180deg,#26b563,#1d9d54);box-shadow:none;font-size:14px;padding:12px}
.btn.peq{font-size:15px;padding:14px}
.btn:active{transform:scale(.985)}
.btn i{font-size:20px;display:flex}

/* ---------- login ---------- */
.login{min-height:100dvh;background:var(--bg);display:flex;flex-direction:column}
.login .topo{background:linear-gradient(180deg,var(--vinho-3),var(--vinho));height:196px;position:relative;display:flex;justify-content:center;align-items:flex-start;padding-top:calc(22px + env(safe-area-inset-top));color:#fff}
.login .topo svg.curva{position:absolute;left:0;bottom:-1px;width:100%;height:44px}
.login .corpo{padding:0 26px 20px;text-align:center;flex:1;display:flex;flex-direction:column}
.login .avatar-ic{font-size:60px;color:var(--vinho-txt);margin:2px auto 0;position:relative;width:64px}
.login .avatar-ic .moeda{position:absolute;right:-2px;bottom:6px;width:20px;height:20px;border-radius:50%;background:#f5b53d;border:3px solid var(--bg)}
.login h2{margin:6px 0 22px;font-size:26px;color:var(--vinho-txt);font-weight:800}
.campo{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:0 16px;height:56px;margin-bottom:14px;box-shadow:0 2px 6px rgba(120,20,40,.04)}
.campo i{font-size:22px;color:var(--t3);display:flex}
.campo input{flex:1;border:0;outline:0;background:transparent;font-size:16px;color:var(--texto);min-width:0}
.campo input::placeholder{color:var(--muted2)}
.campo button{border:0;background:transparent;color:var(--t3);font-size:22px;display:flex;padding:4px}
.linha-opc{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin:4px 0 24px}
.linha-opc label{display:flex;align-items:center;gap:10px;color:var(--texto)}
.chk{appearance:none;width:22px;height:22px;border-radius:6px;background:var(--card);border:1.6px solid var(--chk-borda);display:grid;place-items:center;margin:0}
.chk:checked{background:var(--verde);border-color:var(--verde)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.4px 2.4px 0;transform:rotate(45deg) translate(-1px,-1px)}
.linha-opc a{color:var(--vinho-txt);text-decoration:underline;font-weight:600}
.ou{display:flex;align-items:center;gap:14px;color:var(--muted);font-weight:600;margin:26px 0 0}
.ou::before,.ou::after{content:"";flex:1;height:1px;background:var(--grip)}
.login .rodape{margin-top:auto;padding-top:26px;color:var(--muted);font-size:13.5px}
.erro-login{color:var(--vermelho-tx);font-size:13.5px;margin:-6px 0 12px;min-height:0}

/* ---------- topo do app ---------- */
.topo-marca{display:flex;align-items:center;gap:9px;padding:calc(12px + env(safe-area-inset-top)) 18px 10px;background:var(--bg)}
.topo-marca .sep{width:1px;height:38px;background:var(--sep)}
.topo-marca .tt{min-width:0}
.topo-marca .tt b,.topo-marca .tt span{white-space:nowrap}
.topo-marca .tt b{display:block;font-size:14.5px;color:var(--vinho-txt);font-weight:800;line-height:1.15}
.topo-marca .tt span{font-size:11.5px;color:var(--muted)}
.topo-marca .av{margin-left:auto;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--av1),var(--vinho-3));color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.topo-vinho{background:linear-gradient(180deg,var(--vinho),var(--vinho-4));color:#fff;display:flex;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 18px 30px;position:sticky;top:0;z-index:5}
.topo-vinho h1{margin:0;font-size:20px;font-weight:800;flex:1}
.topo-vinho .bt{border:0;background:transparent;color:#fff;font-size:25px;display:flex;padding:2px;position:relative}
.topo-vinho .bt .bdg{position:absolute;top:-4px;right:-5px}
.bdg{background:#e5384c;color:#fff;font-size:10.5px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:1.5px solid #fff}
.folha{background:var(--bg);border-radius:22px 22px 0 0;margin-top:-16px;padding:16px 16px 96px;min-height:calc(100dvh - 60px);position:relative;z-index:6}
.tela{padding:0 16px 100px;animation:ent .18s ease-out}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- cartões ---------- */
.card{background:var(--card);border:1px solid var(--linha);border-radius:18px;box-shadow:0 2px 8px rgba(120,20,40,.05)}
.hero{padding:18px 18px 16px;margin:8px 0 14px}
.hero h2{margin:0 0 6px;font-size:23px;font-weight:800;letter-spacing:-.2px}
.hero p{margin:0;font-size:14px;line-height:1.35;color:var(--muted)}
.hero.ic{display:flex;gap:14px;align-items:center;padding:16px}
.hero.ic .bolaic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:24px;flex:none}
.hero.ic h2{font-size:17.5px;margin:0 0 3px;letter-spacing:-.2px}
.hero.ic p{font-size:12.5px}
.grade2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:14px}
.grade3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{padding:14px 14px 12px;text-align:left;border:1px solid var(--linha);border-radius:16px;background:var(--card);box-shadow:0 2px 8px rgba(120,20,40,.05);font-family:inherit;color:inherit}
.kpi .cab{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.kpi .cab .q{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:19px;flex:none}
.kpi .cab .l{font-size:14.5px;color:var(--t3);flex:1;line-height:1.15}
.kpi .cab .ch{font-size:15px;color:var(--chev);display:flex}
.kpi .v{font-size:29px;font-weight:800;letter-spacing:-.5px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi.peq{padding:13px 11px;min-width:0}
.kpi.peq .ic0{font-size:21px;display:flex;margin-bottom:6px}
.kpi.peq .l2{font-size:13px;font-weight:600;line-height:1.2;min-height:47px;margin-bottom:4px}
.kpi.peq .v{font-size:22px;letter-spacing:-.7px}
.kpi.peq .dl{font-size:11.5px;margin-top:6px;font-weight:600}
.q.vm{background:var(--tint-p);color:var(--acc)}.q.vd{background:var(--verde-bg);color:#1fa75a}.q.am{background:var(--amarelo-bg);color:#f0a020}.q.rx{background:var(--roxo-bg);color:var(--roxo)}
.c-verde{color:var(--verde)}.c-laranja{color:var(--laranja)}.c-verm{color:var(--vermelho)}.c-roxo{color:var(--roxo)}
.sec-t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15.5px;margin:6px 2px 10px}
.sec-t i{font-size:20px;color:var(--vinho-txt);display:flex}
.topo-marca .cal-bt{margin-left:auto;border:0;background:transparent;color:var(--vinho-txt);font-size:25px;display:flex;padding:6px}
.topo-marca .cal-bt + .av{margin-left:0}
.faixa-hist{display:flex;align-items:center;gap:10px;background:var(--amarelo-bg);border-bottom:1px solid var(--amarelo-borda);color:var(--amarelo-tx);padding:9px 16px;font-size:13px;font-weight:600}
.faixa-hist i{font-size:19px;display:flex}
.faixa-hist button{margin-left:auto;border:0;background:var(--vinho);color:#fff;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700;white-space:nowrap}
.hist-dica{font-size:13.5px;color:var(--muted);margin:2px 2px 12px;line-height:1.4}
.hist-dia{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(120,20,40,.05);font-family:inherit;color:inherit}
.hist-dia.on{border-color:var(--vinho-txt);box-shadow:0 0 0 2px var(--vinho-txt) inset}
.hist-dia .cal{width:48px;height:52px;border-radius:12px;background:var(--tint-p);color:var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1.05}
.hist-dia .cal b{font-size:21px}.hist-dia .cal span{font-size:11px;text-transform:uppercase;font-weight:700;letter-spacing:.4px}
.hist-dia .tx{flex:1;min-width:0}
.hist-dia .tx b{display:flex;align-items:center;gap:8px;font-size:15px}
.hist-dia .tx small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.hist-dia .tps{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.hist-dia .tps span{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--seg-bg);color:var(--t3)}
.hist-dia .hoje{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--verde-bg);color:var(--verde-tx)}
.hist-dia .ch{color:var(--chev);display:flex}
.sec-t small{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}
.sec-kpi{margin:2px 2px 10px}
.vazio-ds{padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:4px}
.vazio-ds span{font-size:13px;color:var(--muted)}
.sec-t a{margin-left:auto;font-size:13px;font-weight:600;color:var(--vinho-txt);cursor:pointer}
.grafico{padding:14px 12px 10px;margin-bottom:14px}
.grafico h3{margin:0 0 4px 4px;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.grafico h3 i{color:var(--muted2);font-size:18px;display:flex}
.grafico .chv{margin-left:auto;color:var(--chev);display:flex}
.legenda{display:flex;gap:16px;font-size:12px;color:var(--t3);margin:0 0 6px 6px}
.legenda span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c)}
.aviso{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(90deg,var(--aviso-a),var(--aviso-b));width:100%;text-align:left;border:1px solid var(--aviso-borda);border-radius:16px;font-family:inherit;color:inherit}
.aviso .ic2{font-size:26px;color:var(--verde);display:flex}
.aviso b{display:block;font-size:15px}.aviso small{font-size:13px;color:var(--t3)}
.aviso .ch{margin-left:auto;color:var(--chev);font-size:16px;display:flex}
.aviso.ruim .ic2{color:var(--vermelho)}
.aviso+.aviso{margin-top:10px}

/* ---------- navegação inferior ---------- */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--linha);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -4px 16px rgba(120,20,40,.06)}
.nav button{flex:1;border:0;background:transparent;color:var(--muted2);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;padding:4px 0 8px;position:relative}
.nav button i{font-size:25px;display:flex;position:relative}
.nav button.on{color:var(--acc);font-weight:700}
.nav button.on::after{content:"";position:absolute;bottom:0;left:50%;width:26px;height:3px;border-radius:3px;background:var(--acc);transform:translateX(-50%)}
.nav .bdg{position:absolute;top:-4px;right:-9px}

/* ---------- entregas ---------- */
.busca{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--linha);border-radius:999px;padding:0 16px;height:46px;margin-bottom:12px;color:var(--muted2)}
.busca i{font-size:19px;display:flex}
.busca input{flex:1;border:0;outline:0;font-size:15px;background:transparent;color:var(--texto);min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--chip-borda);background:var(--card);color:var(--t2);border-radius:999px;padding:8px 10px;font-size:12px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:5px}
.chip.on{background:var(--vinho);border-color:var(--vinho);color:#fff;font-weight:600}
.chip .n{background:#e5384c;color:#fff;border-radius:9px;font-size:11px;padding:1px 6px;font-weight:700}
.chip .cv{font-size:14px;display:flex}
.tab-h{display:grid;grid-template-columns:22px minmax(0,1fr) 72px 62px 56px 8px;gap:4px;font-size:9px;letter-spacing:.2px;color:var(--muted2);font-weight:600;padding:2px 10px 8px;white-space:nowrap}
.lista-ent{background:var(--card);border:1px solid var(--linha);border-radius:16px;overflow:hidden}
.ent{display:block;width:100%;text-align:left;border:0;background:var(--card);padding:12px 8px 10px 10px;border-bottom:1px solid var(--linha2);font-family:inherit;color:inherit}
.ent:last-child{border-bottom:0}
.ent.atr{background:var(--row-atraso)}
.ent .r1{display:grid;grid-template-columns:22px minmax(0,1fr) 72px 62px 56px 8px;gap:4px;align-items:center}
.rank{width:22px;height:22px;border-radius:50%;background:var(--verde);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.rank.r{background:var(--vermelho)}.rank.n{background:#6b4a44}
.ent .nm{font-size:12.5px;line-height:1.2;font-weight:500}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:3px 8px;border-radius:8px;text-align:center}
.pill.f{background:var(--verde-bg);color:var(--verde-tx)}
.pill.a{background:var(--pill-a);color:var(--vermelho-tx);font-family:var(--sans);font-weight:700}
.pill.e{background:var(--amarelo-bg);color:var(--amarelo-tx)}
.ent .hh{font-family:var(--mono);font-size:12px;padding-left:2px}
.ent .tp{font-size:11.5px;color:var(--t2);white-space:nowrap}
.ent .ch{color:var(--chev);font-size:13px;display:flex}
.prog{display:flex;align-items:center;gap:8px;margin:7px 14px 0 26px}
.prog .tr{flex:1;height:5px;border-radius:5px;background:var(--track);overflow:hidden}
.prog .tr i{display:block;height:100%;border-radius:5px;background:var(--verde)}
.prog.r .tr i{background:var(--vermelho)}
.prog small{font-size:10.5px;color:var(--muted2);font-family:var(--mono);min-width:30px;text-align:right}
.vazio{padding:34px 16px;text-align:center;color:var(--muted);font-size:14px}

/* ---------- rotas ---------- */
.rotas{padding:4px 14px}
.rota-i{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--linha2);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;font-family:inherit;color:inherit}
.rota-i:last-child{border-bottom:0}
.rota-i .st{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:15px;color:#fff}
.rota-i .st.ok{background:var(--verde)}
.rota-i .st.and{background:var(--card);border:3px solid #f3b13a;color:transparent;position:relative}
.rota-i .st.and::after{content:"";position:absolute;inset:4px;background:#f3b13a;border-radius:50%}
.rota-i .st.ag{background:var(--card);border:2px solid var(--ring)}
.rota-i .st.ag::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--ring)}
.rota-i .tx{flex:1;min-width:0}
.rota-i .tx b{display:block;font-size:14px;font-weight:600}
.rota-i .tx span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.rota-i .dir{text-align:right;font-size:11.5px;color:var(--t3);min-width:74px;white-space:nowrap}
.rota-i .dir .mb{display:flex;align-items:center;gap:6px;margin-top:4px;justify-content:flex-end;font-size:11px}
.rota-i .dir .mb i{display:block;width:44px;height:4px;background:var(--track);border-radius:4px;overflow:hidden}
.rota-i .dir .mb i s{display:block;height:100%;background:var(--verde);text-decoration:none}
.rota-i .dir .mb i s.v{background:var(--vermelho)}
.rota-i .ch{color:var(--chev);font-size:13px;display:flex}
.btn-atualizar{position:relative;overflow:hidden;margin-top:16px}
.btn-atualizar .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.18);width:0;transition:width .35s}
.btn-atualizar span{position:relative;display:flex;align-items:center;gap:10px}
.btn-atualizar.rod i{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.etp{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--linha2);font-size:15.5px;cursor:pointer;color:var(--texto)}
.etp:last-of-type{border-bottom:0}
.etp .chk{flex:none;width:24px;height:24px;border-radius:7px}
.etp.todos{font-weight:700}
.etp-sep{height:1px;background:var(--linha);margin:2px 0}
.bk-acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.bk-acoes .btn{margin:0;padding:12px 8px;font-size:13px;line-height:1.2}
.bk-acoes .btn svg{width:17px;height:17px}
.bk-item{padding:12px 14px;margin-bottom:10px}
.bk-item .l1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bk-item .br{font-family:var(--mono);font-weight:700;font-size:14px}
.bk-item .l2{font-size:13px;color:var(--t2);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 14px}
.bk-item .l2 span{display:flex;align-items:center;gap:5px}
.bk-item .l2 svg{width:15px;height:15px;flex:none;color:var(--muted2)}
.bk-item .l3{font-size:12px;color:var(--muted);margin-top:4px}
.bk-dias{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.bk-dias.a0{background:var(--verde-bg);color:var(--verde-tx)}
.bk-dias.a1{background:var(--amarelo-bg);color:var(--amarelo-tx)}
.bk-dias.a2{background:var(--pill-a);color:var(--vermelho-tx)}
.bk-dias.a3{background:var(--vermelho-bg);color:var(--vermelho-tx)}
.bk-nota{font-size:12.5px;color:var(--muted);margin:2px 2px 12px;line-height:1.4}
.pill-prem{display:flex;align-items:center;gap:5px;border:0;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(180deg,#f7931e,#e0740a);box-shadow:0 2px 8px rgba(224,116,10,.35);white-space:nowrap}
.pill-prem svg{width:14px;height:14px}
.topo-marca{gap:7px}
.topo-marca .logo-emb{width:42px}
.topo-marca .tt b{font-size:13.5px}
.topo-marca .tt span{font-size:11px}
.topo-marca .cal-bt{padding:4px;font-size:20px}
.pill-prem{padding:6px 10px;font-size:11.5px}
.bloq{position:relative;margin-bottom:14px}
.bloq .kpi .v,.bloq .ent{filter:blur(6px);user-select:none;pointer-events:none}
.bloq-ov{position:absolute;inset:0;border:0;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.10));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--texto);cursor:pointer;font-family:inherit}
.bloq-ov svg{width:26px;height:26px;color:#e0740a}
.bloq-ov b{font-size:15px}
.bloq-ov span{font-size:12px;color:var(--muted)}
.cta-prem{padding:18px;margin:14px 0;text-align:center;border:1.6px dashed #e0740a}
.cta-prem h3{margin:0 0 6px;font-size:17px}
.cta-prem p{margin:0 0 12px;font-size:14px;color:var(--t2);line-height:1.45}
.cta-prem a.btn{display:flex;text-decoration:none;justify-content:center}
.lista-prem{list-style:none;margin:0 0 6px;padding:0}
.lista-prem li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--linha2);font-size:14px;line-height:1.35}
.lista-prem li:last-child{border-bottom:0}
.lista-prem li i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-style:normal;font-weight:800}
.lista-prem li i.ok{background:var(--verde-bg);color:var(--verde-tx)}
.lista-prem li i.bl{background:var(--amarelo-bg);color:var(--amarelo-tx)}
.previa{white-space:pre-wrap;font:13px/1.45 var(--mono);background:var(--campo-bg);border:1px solid var(--linha);border-radius:12px;padding:12px;max-height:38vh;overflow:auto;margin:6px 0 12px;color:var(--texto)}
.perfil-linha{display:flex;gap:8px;margin-top:8px}
.perfil-linha .btn{flex:1;margin-top:0;font-size:15px;padding:14px}
.perfil-linha .lixo{flex:none;width:54px;border-radius:14px;border:1.6px solid var(--vermelho);color:var(--vermelho);background:var(--card);font-size:22px;display:grid;place-items:center;padding:0}
.btn.perigo{background:linear-gradient(180deg,#e0364a,#c22a3d);box-shadow:none}
.prog-txt{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px;min-height:16px}

/* ---------- PNR ---------- */
.pnr-c{padding:12px 14px 12px;margin-bottom:12px;border-radius:16px;background:var(--card);border:1px solid var(--linha);box-shadow:0 2px 8px rgba(120,20,40,.05);display:block;width:100%;text-align:left;font-family:inherit;color:inherit}
.pnr-c .l1{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pnr-c .l1 .tg{font-weight:800;font-size:13px;color:var(--vinho-txt)}
.pnr-c .l1 .cd{font-family:var(--mono);font-weight:700;font-size:12px}
.pnr-c .l1 .cv{color:var(--chev);font-size:12px;display:flex}
.pv{font-size:11px;font-weight:700;padding:3px 8px;border-radius:9px;white-space:nowrap}
.pnr-c .l1 .pv{margin-left:auto}
.pv.venc{background:var(--vermelho-bg);color:var(--vermelho-tx)}
.pv.pdr{background:var(--vermelho-bg);color:var(--vinho-txt)}
.pv.pdr.ok{background:var(--verde-bg);color:var(--verde-tx)}
.pv.rev{background:var(--amarelo-bg);color:var(--amarelo-tx)}
.pnr-c .l2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pnr-c .inf{font-size:12.5px;line-height:1.55;color:var(--t2);min-width:0;flex:1}
.pnr-c .inf div{display:flex;align-items:center;gap:8px;white-space:nowrap}
.pnr-c .inf div:first-child{white-space:normal}
.pnr-c .inf i{font-size:15px;color:var(--vinho-txt);display:flex;width:16px;justify-content:center}
.pnr-c .inf .rs{font-weight:800;color:var(--vinho-txt);font-size:11px;width:16px;text-align:center}
.pnr-c .inf .sep2{color:var(--sep2);margin:0 4px}
.pnr-c .inf small{color:var(--muted)}
.pnr-c .btn.verde{margin-top:10px;border-radius:9px}
.det-topo{padding:14px;margin-bottom:12px}
.det-topo .l1{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.det-topo .inf{font-size:14px;line-height:2;color:var(--t2)}
.det-topo .inf div{display:flex;align-items:center;gap:10px}
.det-topo .inf i{font-size:17px;color:var(--vinho-txt);display:flex;width:18px;justify-content:center}
.det-topo .inf .rs{font-weight:800;color:var(--vinho-txt);font-size:12px;width:18px;text-align:center}
.timeline{display:flex;justify-content:space-between;position:relative;padding:14px 4px 6px;margin-bottom:12px}
.timeline .pt{flex:1;text-align:center;position:relative;font-size:12px;font-weight:600;line-height:1.25}
.timeline .pt small{display:block;font-weight:400;color:var(--muted2);font-size:11.5px}
.timeline .pt .bl{width:24px;height:24px;border-radius:50%;margin:0 auto 10px;border:4px solid #f3b13a;background:var(--card);position:relative;z-index:1}
.timeline .pt.at .bl{border-color:#ee7a1f;background:#ee7a1f;box-shadow:0 0 0 4px var(--glow-at)}
.timeline .pt.fu .bl{border-color:var(--ring)}
.timeline .pt:not(:last-child)::after{content:"→";position:absolute;top:2px;left:calc(50% + 18px);right:calc(-50% + 18px);color:#dcbf9a;font-size:14px;text-align:center;line-height:24px;overflow:hidden}
.timeline .pt.at{color:#c5480a}
.msg-c{padding:14px;margin-bottom:12px}
.msg-c h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.msg-c h3 i{font-size:20px;display:flex}
.msg-c textarea{width:100%;height:92px;border:1px solid var(--linha);border-radius:10px;padding:12px;font-size:14.5px;resize:none;outline:0;background:var(--campo-bg);color:var(--texto)}
.msg-c .cnt{text-align:right;font-size:12px;color:var(--muted);margin:4px 2px 10px}
.acoes-c{padding:14px;display:flex;flex-direction:column;gap:12px}
.acoes-c .btn{font-size:15px;padding:15px;border-radius:10px}
.acoes-c .btn.verde{font-size:15px;padding:15px}

/* ---------- perfil ---------- */
.perfil-h{display:flex;align-items:center;gap:14px;padding:18px;margin:8px 0 14px}
.perfil-h .av2{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--av1),var(--vinho-3));color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700}
.perfil-h b{display:block;font-size:19px}.perfil-h span{font-size:13px;color:var(--muted)}
.lista-op{padding:2px 14px;margin-bottom:14px}
.op{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--linha2);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;font-family:inherit;color:inherit;font-size:15px}
.op:last-child{border-bottom:0}
.op i.ico{font-size:21px;color:var(--vinho-txt);display:flex}
.op .ch{margin-left:auto;color:var(--chev);display:flex}
.op small{display:block;color:var(--muted);font-size:12.5px}
.seg{display:flex;background:var(--seg-bg);border-radius:12px;padding:4px;margin:2px 0 12px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px;font-size:14px;font-weight:600;color:var(--t3)}
.seg button.on{background:var(--card);color:var(--vinho-txt);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.meta-in{display:flex;align-items:center;gap:10px;padding:10px 0}
.apar{padding:14px;margin-bottom:14px}
.apar .seg{margin:0 0 14px}
.apar-t{font-size:13px;color:var(--muted);margin:0 2px 10px}
.apar-t b{color:var(--texto);font-weight:700}
.pal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 8px;justify-items:center}
.pal{width:44px;height:44px;border-radius:50%;border:3px solid transparent;padding:0;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.pal.on{border-color:var(--card);outline:3px solid var(--vinho-txt)}
.pal.on::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:14px;border:solid #fff;border-width:0 2.6px 2.6px 0;transform:translate(-50%,-62%) rotate(45deg)}
.meta-in input{width:84px;border:1px solid var(--linha);border-radius:10px;padding:9px 10px;font-size:15px;text-align:center;font-family:var(--mono);background:var(--campo-bg);color:var(--texto)}

.spin{width:46px;height:46px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:gira 1s linear infinite;margin:38px auto 8px}
.aviso-vazio{background:linear-gradient(90deg,var(--amarelo-bg),var(--amarelo-bg2));border-color:var(--amarelo-borda)}
.aviso-vazio .ic2{color:#e59a12}
/* ---------- toast e folha ---------- */
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--toast-bg);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.fundo{position:fixed;inset:0;background:rgba(30,10,18,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:ent .15s}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:86dvh;overflow:auto}
.sheet .grip{width:42px;height:4px;border-radius:4px;background:var(--grip);margin:4px auto 14px}
.sheet h3{margin:0 0 4px;font-size:19px}.sheet .sb{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.sheet .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;text-align:center}
.sheet .g4 div{background:var(--bg);border-radius:12px;padding:10px 4px}
.sheet .g4 b{display:block;font-size:19px;font-family:var(--mono)}.sheet .g4 span{font-size:11.5px;color:var(--muted)}
.sheet .btn{margin-top:10px;border-radius:12px;padding:14px;font-size:15px}
</style>
</head>

const LS = {

/* ==========================================================

const PALETAS = [

function aplicarTema(){
  const raiz = document.documentElement, est = raiz.style;
  VARS_TEMA.forEach(v=>est.removeProperty(v));
  const escuro = TEMA.modo==='escuro';
  raiz.setAttribute('data-tema', TEMA.modo);

  if(!(TEMA.pal===0 && !escuro)){                       // padrão claro = CSS original, sem sobrescrever
    const p = PALETAS[TEMA.pal], h = p.h, s = p.s;

      set({
        '--vinho':hsl(h,S,27), '--vinho-2':hsl(h,S-8,34), '--vinho-3':hsl(h,S,20), '--vinho-4':hsl(h,S,23), '--vinho-txt':hsl(h,S,27),
        '--acc':hsl(h,c(s,25,80),50), '--tint-p':hsl(h,c(s,25,85),94), '--av1':hsl(h,S-15,40),
        '--bg':hsl(h,Math.min(s,45),97), '--linha':hsl(h,Math.min(s,35),92), '--linha2':hsl(h,Math.min(s,35),94.5), '--track':hsl(h,Math.min(s,22),90),
        '--grid':hsl(h,Math.min(s,35),92), '--chip-borda':hsl(h,Math.min(s,30),89), '--grip':hsl(h,Math.min(s,20),84), '--sep':hsl(h,Math.min(s,20),85),
        '--chk-borda':hsl(h,Math.min(s,15),78), '--ring':hsl(h,Math.min(s,12),79), '--sep2':hsl(h,Math.min(s,12),80),
        '--campo-bg':hsl(h,Math.min(s,40),99), '--seg-bg':hsl(h,Math.min(s,35),94), '--fora':hsl(h,Math.min(s,35),92),
        '--aviso-a':hsl(h,Math.min(s,60),95.5), '--aviso-b':hsl(h,Math.min(s,50),98), '--aviso-borda':hsl(h,Math.min(s,45),90),
        '--texto':hsl(h,10,15), '--t2':hsl(h,8,25), '--t3':hsl(h,6,36), '--muted':hsl(h,6,45), '--muted2':hsl(h,5,54), '--chev':hsl(h,6,69),
        '--sp1':hsl(h,S,17), '--sp2':hsl(h,S,25), '--sp3':hsl(h,S-10,42), '--sp4':hsl(h,Math.min(s,40),88), '--feat-tx':hsl(h,S,20),
        '--toast-bg':hsl(h,10,15),
      });
    } else {
      set({
        '--vinho':hsl(h,S,38), '--vinho-2':hsl(h,S,44), '--vinho-3':hsl(h,S,28), '--vinho-4':hsl(h,S,32), '--vinho-txt':hsl(h,Math.min(S+10,90),72),
        '--acc':hsl(h,c(s,30,85),62), '--tint-p':hsl(h,Math.min(s,50),20), '--av1':hsl(h,S,45),
        '--bg':hsl(h,Math.min(s,30),6), '--card':hsl(h,Math.min(s,30),10), '--linha':hsl(h,Math.min(s,35),17), '--linha2':hsl(h,Math.min(s,30),14),
        '--track':hsl(h,Math.min(s,25),19), '--grid':hsl(h,Math.min(s,30),16), '--chip-borda':hsl(h,Math.min(s,30),21), '--grip':hsl(h,Math.min(s,20),30),
        '--sep':hsl(h,Math.min(s,20),25), '--chk-borda':hsl(h,Math.min(s,15),38), '--ring':hsl(h,Math.min(s,15),36), '--sep2':hsl(h,Math.min(s,15),32),
        '--campo-bg':hsl(h,Math.min(s,30),8), '--seg-bg':hsl(h,Math.min(s,30),14), '--fora':hsl(h,Math.min(s,30),3),
        '--row-atraso':'rgba(224,54,74,.13)', '--aviso-a':hsl(h,Math.min(s,40),13), '--aviso-b':hsl(h,Math.min(s,35),10), '--aviso-borda':hsl(h,Math.min(s,35),20),
        '--texto':'#f3f0f1', '--t2':hsl(h,8,84), '--t3':hsl(h,6,72), '--muted':hsl(h,6,63), '--muted2':hsl(h,5,55), '--chev':hsl(h,6,44),
        '--sp1':hsl(h,S,12), '--sp2':hsl(h,S,19), '--sp3':hsl(h,S-10,27), '--sp4':hsl(h,Math.min(s,30),9), '--feat-tx':'#f1ecee',
        '--toast-bg':hsl(h,10,24),
        '--verde-bg':'rgba(31,167,90,.18)', '--verde-tx':'#5fd08e', '--amarelo-bg':'rgba(243,177,58,.16)', '--amarelo-tx':'#f3c46a',
        '--amarelo-bg2':'rgba(243,177,58,.08)', '--amarelo-borda':'rgba(243,177,58,.32)', '--vermelho-bg':'rgba(224,54,74,.2)', '--vermelho-tx':'#ff8f9d',
        '--roxo-bg':'rgba(106,79,194,.28)', '--pill-a':'rgba(224,54,74,.26)', '--glow-at':'rgba(238,122,31,.28)',

    }

    /* já tratado acima com h=340 */
  }
  const cor = getComputedStyle(raiz).getPropertyValue('--vinho').trim();
  const meta = document.querySelector('meta[name=theme-color]'); if(meta && cor) meta.setAttribute('content', cor);
}
function salvarTema(){ LS.set('xpt_tema_m', TEMA.modo); LS.set('xpt_pal_m', String(TEMA.pal)); }
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fInt = n => Math.round(n).toLocaleString('pt-BR');
const fPct = (n,d=2) => Number(n).toFixed(d).replace('.',',')+'%';
const fMoney = n => 'R$ '+Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fDias = n => n==null ? '—' : Math.abs(n).toFixed(1).replace('.',',')+'d';

/* ==========================================================

/* ==========================================================
   DADOS REAIS — vêm do servidor do PC (servidor-local.js)
   O celular baixa os CSVs de hoje e calcula tudo aqui, com as
   MESMAS regras do painel do PC (metrics.js).
   ========================================================== */
function csvParse(texto){
  if(!texto) return [];
  texto = texto.replace(/^\uFEFF/,'');
  let fimPrim = texto.indexOf('\n'); if(fimPrim<0) fimPrim = texto.length;
  const prim = texto.slice(0, fimPrim);
  const cont = c => prim.split(c).length-1;
  const delim = [',',';','\t'].map(d=>[d,cont(d)]).sort((a,b)=>b[1]-a[1])[0][0];
  const linhas=[]; let campo='', linha=[], aspas=false;
  for(let i=0;i<texto.length;i++){
    const c=texto[i];
    if(aspas){ if(c==='"'){ if(texto[i+1]==='"'){ campo+='"'; i++; } else aspas=false; } else campo+=c; }
    else if(c==='"') aspas=true;
    else if(c===delim){ linha.push(campo); campo=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&texto[i+1]==='\n') i++; linha.push(campo); campo=''; if(linha.length>1||linha[0]!=='') linhas.push(linha); linha=[]; }
    else campo+=c;
  }
  if(campo!==''||linha.length){ linha.push(campo); linhas.push(linha); }
  if(!linhas.length) return [];
  const cab = linhas.shift().map(h=>h.trim());
  return linhas.map(l=>{ const o={}; cab.forEach((h,i)=>{ o[h]=l[i]??''; }); return o; });
}
const linhasBacklog = arquivos => (arquivos||[]).flatMap(a=>{ let t=(a.conteudo||'').replace(/^\uFEFF/,''); const i=t.search(/^[^\n]*Shipment ID[^\n]*$/m); if(i>0) t=t.slice(i); return csvParse(t); });
const agingRankBk = b => { b=String(b||''); if(b.includes('>6')) return 3; if(b.includes('3 days, 6')||b.includes('3 dias, 6')) return 2; if(b.includes('1 day, 3')||b.includes('1 dia, 3')) return 1; return 0; };
const linhasDe = arquivos => (arquivos||[]).flatMap(a=>csvParse(a.conteudo||''));
const dataSpx = v => { const m=(v||'').toString().trim().match(/^(\d{2})-(\d{2})-(\d{4})\s+(\d{2}):(\d{2})/); return m ? new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]) : null; };
const hhmm = d => d ? `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` : '-';
const duracao = ms => { if(ms==null||ms<0) return '-'; const t=Math.floor(ms/60000), h=Math.floor(t/60), m=t%60; return h>0?`${h}h ${m}min`:`${m}min`; };
const normFone = v => { if(!v) return null; let d=String(v).replace(/\D/g,'').replace(/^0+/,''); if(!d) return null; if(d.startsWith('55')&&(d.length===12||d.length===13)) return d; if(d.length===10||d.length===11) return '55'+d; return null; };
const semAcento = t => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
// coluna com o nome do cliente (comprador/destinatário), seja qual for o nome exato dela no arquivo
const CLIENTE_REGEX = [/^(buyer|customer|recipient|receiver|consignee)[\s_]*name$/i, /(buyer|customer|recipient|receiver|consignee|cliente|comprador|destinat[aá]rio).*(name|nome)/i, /^(buyer|customer|recipient|receiver|consignee|cliente|comprador|destinat[aá]rio)$/i];
// coluna com o telefone do cliente (nunca a do entregador)
const CLIENTE_FONE_REGEX = [/(buyer|customer|recipient|receiver|consignee).*(phone|tel|mobile|contact|cell)/i, /(phone|tel|mobile|contact|cell).*(buyer|customer|recipient|receiver|consignee)/i, /(cliente|comprador|destinat[aá]rio).*(telefone|fone|celular|contato|whats)/i];
const campoFoneCliente = linha => { const ks = Object.keys(linha||{}); for(const rx of CLIENTE_FONE_REGEX){ const k = ks.find(x=>rx.test(x) && !/driver|motorista|entregador/i.test(x)); if(k) return k; } return null; };
// "CARLOS EDUARDO LIMA" -> "Carlos Eduardo Lima"
const nomeProprio = n => (n||'').toString().trim().toLowerCase().split(/\s+/).filter(Boolean).map((w,i)=> (i>0 && ['da','de','do','das','dos','e'].includes(w)) ? w : w.replace(/^\p{L}/u, c=>c.toUpperCase())).join(' ');
// 98991234567 -> (98) 99123-4567
const formatarFoneBR = v => { let d=String(v||'').replace(/\D/g,''); if(!d) return ''; if(d.startsWith('55') && (d.length===12||d.length===13)) d=d.slice(2); if(d.length===11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; if(d.length===10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return String(v).trim(); };
const campoCliente = linha => { const ks = Object.keys(linha||{}); for(const rx of CLIENTE_REGEX){ const k = ks.find(x=>rx.test(x)); if(k) return k; } return null; };
const nomeManipulador = raw => (raw||'').toString().replace(/^\[\d+\]\s*/,'').trim();
const nomeEstacao = raw => { const m=(raw||'').match(/^XPT_([A-Za-z]{2})_(.+)$/); return m ? `${m[2]} - ${m[1].toUpperCase()}` : (raw||''); };
const ABERTOS_PNR = ['Created','Assigned','Pending Driver Reply','Reviewing'];
const CAMPOS_CRIACAO_PNR = ['Create Time','Created Time','Created At','Ticket Create Time','Create Date','Creation Time'];

let Calc = null;   // calculateMetrics do painel do PC (metrics.js)
async function carregarMotor(){
  if(Calc) return Calc;
  const m = await import('./metrics.js');
  Calc = m.calculateMetrics;
  return Calc;
}

function modeloDeDados(hoje, ontem, perfilAtivo, cepToCity, agoraFixo, manuais){
  const calc = Calc;
  const agora = agoraFixo || new Date();
  const meta = parseFloat(LS.get('xpt_meta')) || 98;
  const sla = linhasDe(hoje.SLA), ds = linhasDe(hoje.DS), pnrRows = linhasDe(hoje.PNR);
  const mSla = calc(sla,'SLA',cepToCity), mDs = calc(ds,'DS',cepToCity);

  // ---- contatos e cidades ----
  const contatos = {};
  const campoFone = f => Object.keys(f||{}).find(k=>/driver.*phone/i.test(k));
  // telefones dos arquivos de hoje e do dia anterior (quem não rodou hoje ainda pode estar lá)
  const linhasOntem = ontem ? [...linhasDe(ontem.SLA), ...linhasDe(ontem.DS)] : [];
  [...sla,...ds,...linhasOntem].forEach(r=>{ const k=campoFone(r); const nm=(r['Driver Name']||'').trim(); if(k&&nm&&r[k]&&!contatos[nm]) contatos[nm]=r[k]; });
  const manC = (manuais&&manuais.contatos)||{}, manCid = (manuais&&manuais.cidades)||{};
  const achaPorNome = (obj, nome) => { if(!nome) return null; if(obj[nome]) return obj[nome]; const alvo=semAcento(nome); const k=Object.keys(obj).find(x=>semAcento(x)===alvo); return k ? obj[k] : null; };
  // mesma ordem do painel do PC: primeiro o que foi cadastrado à mão, depois o dos arquivos
  const foneDe = nome => normFone(achaPorNome(manC, nome) || achaPorNome(contatos, nome));
  // nome do cliente (do próprio PNR ou do pedido nos arquivos de SLA/DS)
  const clientePorPedido = {};
  { let kCli = null;
    [...sla,...ds].forEach(r=>{ if(kCli===null) kCli = campoCliente(r) || false; if(!kCli) return;
      const id=(r['Order ID']||'').toString().trim(), n=(r[kCli]||'').toString().trim(); if(id&&n&&!clientePorPedido[id]) clientePorPedido[id]=n; }); }
  const foneClientePorPedido = {};
  { let kTel = null;
    [...sla,...ds].forEach(r=>{ if(kTel===null) kTel = campoFoneCliente(r) || false; if(!kTel) return;
      const id=(r['Order ID']||'').toString().trim(), t=(r[kTel]||'').toString().trim(); if(id&&t&&!foneClientePorPedido[id]) foneClientePorPedido[id]=t; }); }
  const contagem = {};
  [...sla,...ds].forEach(r=>{ const d=(r['Driver Name']||'').trim(), c=cepToCity[r['Postal Code']]; if(!d||!c) return; (contagem[d]=contagem[d]||{})[c]=((contagem[d]||{})[c]||0)+1; });
  const cidadeMotorista = {};
  Object.entries(contagem).forEach(([d,cs])=>{ cidadeMotorista[d]=Object.entries(cs).sort((a,b)=>b[1]-a[1])[0][0]; });
  const cidadePedido = {};
  [...sla,...ds].forEach(r=>{ const id=(r['Order ID']||'').trim(), c=cepToCity[r['Postal Code']]; if(id&&c&&!cidadePedido[id]) cidadePedido[id]=c; });

  // ---- gráfico por hora (mesma regra do painel: 06h–22h, linhas do SLA) ----
  const horas=[]; for(let h=6;h<=22;h++) horas.push(h);
  const ent = horas.map(()=>0), pick = horas.map(()=>0);
  sla.forEach(r=>{
    const d=dataSpx(r['Delivered Time']); if(d){ const h=d.getHours(); if(h>=6&&h<=22) ent[h-6]++; }
    const p=dataSpx(r['Pick Up Time']); if(p){ const h=p.getHours(); if(h>=6&&h<=22) pick[h-6]++; }
  });

  // ---- atuação dos entregadores ----
  const por = {};
  sla.forEach(r=>{
    const nm=(r['Driver Name']||'').trim(); if(!nm) return;
    const e = por[nm] = por[nm] || {nome:nm, pick:null, ult:null, entregues:0, pendentes:0};
    const p=dataSpx(r['Pick Up Time']); if(p&&(!e.pick||p<e.pick)) e.pick=p;
    const d=dataSpx(r['Delivered Time']); if(d&&(!e.ult||d>e.ult)) e.ult=d;
    const st=(r['Status']||'').trim();
    if(st==='Delivered') e.entregues++; else if(st==='Delivering') e.pendentes++;
  });
  const LIMITE_ATRASO = 2*3600*1000;
  const drivers = Object.values(por).map(e=>{
    const total = e.entregues + e.pendentes;
    let status = 'Sem rota';
    if(e.pendentes>0){
      const ref = e.ult || e.pick;
      status = (ref && agora-ref > LIMITE_ATRASO) ? 'Atraso' : 'Em andamento';
    } else if(e.entregues>0) status = 'Finalizado';
    const fim = status==='Finalizado' ? e.ult : agora;
    const tempo = e.pick && fim ? duracao(fim-e.pick) : '-';
    return { nome:e.nome, cidade:cidadeMotorista[e.nome]||'', status, subiu:hhmm(e.pick), tempo,
      pct: total>0 ? Math.round(e.entregues/total*100) : 0, entregues:e.entregues, total,
      ultima: e.ult, duracaoMs: e.pick ? (fim-e.pick) : null, telefone: foneDe(e.nome) };
  });
  const ordem = {Atraso:0,'Em andamento':1,'Sem rota':2,Finalizado:3};
  drivers.sort((a,b)=> ordem[a.status]-ordem[b.status] || a.nome.localeCompare(b.nome,'pt-BR'));

  const rotas = drivers.slice(0,8).map(d=>({
    nome:d.nome,
    estado: d.status==='Finalizado' ? 'ok' : d.status==='Sem rota' ? 'ag' : 'and',
    detalhe: d.status==='Finalizado' ? `Finalizada às ${hhmm(d.ultima)}` : d.status==='Sem rota' ? 'Aguardando coleta' : `${d.status==='Atraso'?'Em atraso':'Em andamento'} (${d.tempo})`,
    entregas: d.entregues, pct: d.pct, atraso: d.status==='Atraso',
  }));

  // ---- comparação com o dia anterior ----
  let dDs=null, dPend=null, dOco=null;
  if(ontem){
    const oSla=calc(linhasDe(ontem.SLA),'SLA',cepToCity), oDs=calc(linhasDe(ontem.DS),'DS',cepToCity);
    if(oDs.total>0) dDs = parseFloat(mDs.sla)-parseFloat(oDs.sla);
    if(oSla.pending>0) dPend = (mSla.pending-oSla.pending)/oSla.pending*100;
    if(oSla.onHoldCount>0) dOco = (mSla.onHoldCount-oSla.onHoldCount)/oSla.onHoldCount*100;
  }
  const slaN=parseFloat(mSla.sla)||0, dsN=parseFloat(mDs.sla)||0;
  const alertas = (dsN<meta&&ds.length?1:0) + (mSla.pending>0?1:0) + (mSla.onHoldCount>0?1:0);

  // ---- PNR (mesmas regras do painel) ----
  const mapaCidadeMot = cidadeMotorista;
  const lista = pnrRows.map(r=>{
    const motorista = nomeManipulador(r['Driver']);
    const dl = r['SLA Deadline'] ? new Date(String(r['SLA Deadline']).replace(' ','T')) : null;
    const diff = dl && !isNaN(dl) ? (dl.getTime()-agora.getTime())/86400000 : null;
    const campoCri = CAMPOS_CRIACAO_PNR.find(k=>r[k]);
    const cri = campoCri ? new Date(String(r[campoCri]).replace(' ','T')) : null;
    const id=(r['SPXTN']||'').toString().trim();
    const kPnrCli = campoCliente(r);
    const cliente = (kPnrCli && (r[kPnrCli]||'').toString().trim()) || clientePorPedido[id] || '';
    const kPnrTel = campoFoneCliente(r);
    const telCliente = (kPnrTel && (r[kPnrTel]||'').toString().trim()) || foneClientePorPedido[id] || '';
    return { id, driver:motorista||'Sem responsável', cliente, telCliente, cidade: achaPorNome(manCid, motorista) || cidadePedido[id] || mapaCidadeMot[motorista] || '—',
      valor: parseFloat(r['PNR Order Value'])||0, slaDias: diff, status:(r['Status']||'').trim(),
      criadoDias: cri && !isNaN(cri) ? Math.max(0,Math.floor((agora-cri)/86400000)) : null, analiseDias:null,
      telefone: foneDe(motorista) };
  });
  const abertos = lista.filter(p=>ABERTOS_PNR.includes(p.status)).sort((a,b)=>(a.slaDias??1e9)-(b.slaDias??1e9));
  const bucket = d => d==null?0 : d<0?3 : d<1?2 : d<3?1 : 0;
  const dist=[0,0,0,0]; abertos.forEach(p=>dist[bucket(p.slaDias)]++);

  const bkArquivos = hoje.BACKLOG || [];
  const bkLista = linhasBacklog(bkArquivos).map(r=>{
    const br=(r['Shipment ID']||'').toString().trim(), mot=nomeManipulador(r['Latest User Name']);
    return { br, driver: mot||'Sem responsável', status:(r['Latest Status']||'').toString().trim(),
      cidade: achaPorNome(manCid, mot) || cidadePedido[br] || mapaCidadeMot[mot] || '',
      diasRaw:(()=>{ const t=(r['LM Leg Days']==null?'':String(r['LM Leg Days'])).trim(), n=parseFloat(t); return isNaN(n)?t:String(Math.round(n*100)/100); })(), dias: parseFloat(r['LM Leg Days'])||0,
      aging: agingRankBk(r['LM Leg Aging']), tentativas: parseFloat(r['No. Attempts'])||0, telefone: foneDe(mot) };
  }).filter(x=>x.br);
  const bkSemLeitura = bkArquivos.length>0 && bkArquivos.every(a=>!a.conteudo);
  const greet = nomeEstacao(((sla[0]||ds[0]||pnrRows[0]||{})['Current Station']) || (sla[0]||{})['Station'] || '') || perfilAtivo;
  return {
    perfil: greet || perfilAtivo, perfilAtivo, meta, dia: hoje.data, vazio: sla.length===0 && ds.length===0,
    kpis:{ total:mSla.total, entregues:mSla.delivered, pendentes:mSla.pending, sla:slaN, ds: ds.length ? dsN : null, dsTotal:mDs.total, dsEntregues:mDs.delivered, dsPendentes:mDs.pending, ocorrencias:mSla.onHoldCount, dDs, dPend, dOco },
    hourly:{ labels: horas.map(h=>String(h).padStart(2,'0')+'h'), entregues:ent, pickup:pick },
    drivers, rotas, alertas,
    estacao: ((sla[0]||ds[0]||pnrRows[0]||{})['Current Station']||'').toString().trim(),
    backlog:{ lista:bkLista, temArquivo:bkArquivos.length>0, semLeitura:bkSemLeitura },
    pnr:{ total:pnrRows.length, lista:abertos, dist, valorRisco: abertos.reduce((t,p)=>t+p.valor,0), abertos:abertos.length, vencendo1d: abertos.filter(p=>bucket(p.slaDias)===2).length },
  };
}

const contatosLocais = () => { try{ return JSON.parse(LS.get('xpt_contatos_m')||'{}')||{}; }catch(e){ return {}; } };
const FonteReal = {
  modo: 'real', pin: null, cepMap: {}, _cru: null, manuais: { contatos:{}, cidades:{} },
  async api(caminho, opts={}){
    const r = await fetch(caminho, { cache:'no-store', ...opts, headers:{ 'X-Pin': this.pin||'', ...(opts.headers||{}) } });
    if(r.status===401){ const e=new Error('PIN incorreto'); e.codigo='pin'; throw e; }
    if(r.status===403){ let j={}; try{ j=await r.json(); }catch(x){} const e=new Error(j.erro||'A licença não está validada no PC.'); e.codigo='licenca'; throw e; }
    if(!r.ok) throw new Error('O PC respondeu com erro '+r.status);
    return r.json();
  },
  async validarPin(pin){
    const antes=this.pin; this.pin=pin;
    try{ await this.api('/api/perfis'); return true; }
    catch(e){ if(e.codigo==='pin'){ this.pin=antes; return false; } throw e; }
  },
  async salvarContato(nome, fone){
    this.manuais.contatos = { ...this.manuais.contatos, [nome]: fone };
    const local = contatosLocais(); local[nome] = fone; LS.set('xpt_contatos_m', JSON.stringify(local));   // reserva no celular
    try{ await this.api('/api/manuais/contato', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ nome, telefone:fone }) }); return true; }
    catch(e){ return false; }   // servidor antigo: fica só no celular
  },
  async apagarPerfil(nome){
    const r = await fetch('/api/perfil/apagar', { method:'POST', headers:{'Content-Type':'application/json','X-Pin':this.pin||''}, body:JSON.stringify({nome}) });
    if(r.status===401){ const e=new Error('PIN incorreto'); e.codigo='pin'; throw e; }
    return r.json().catch(()=>({ ok:false, erro:'O PC respondeu de um jeito que não entendi.' }));
  },
  async listarPerfis(){ return this.api('/api/perfis'); },
  async trocarPerfil(nome){ await this.api('/api/perfil?nome='+encodeURIComponent(nome), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({nome}) }); },
  async carregar(){
    await carregarMotor();
    const [hoje, perfis, manuais] = await Promise.all([
      this.api('/api/hoje'), this.api('/api/perfis'),
      this.api('/api/manuais').catch(()=>null),      // contatos e cidades cadastrados à mão no PC
    ]);
    if(manuais) this.manuais = { contatos: {...contatosLocais(), ...(manuais.contatos||{})}, cidades: manuais.cidades||{} };
    else this.manuais = { ...this.manuais, contatos: {...contatosLocais(), ...(this.manuais.contatos||{})} };
    let ontem = null;
    try{
      const dias = await this.api('/api/historico/dias');
      const anteriores = (dias||[]).map(d=>d.data).filter(d=>d && hoje.data && d<hoje.data).sort().reverse();
      if(anteriores.length) ontem = await this.api('/api/historico/dia?data='+anteriores[0]);
    }catch(e){ /* sem comparação com o dia anterior */ }
    this._cru = { hoje, ontem, perfilAtivo: perfis.ativo };
    return this.montar();
  },
  montar(){ const c=this._cru; return modeloDeDados(c.hoje, c.ontem, c.perfilAtivo, this.cepMap, c.agora, this.manuais); },
  // ---- histórico (mesmos dados que o painel do PC guarda dia a dia) ----
  async listarDias(){ const d = await this.api('/api/historico/dias'); return Array.isArray(d) ? d : []; },
  async carregarDia(data, dias){
    const dia = await this.api('/api/historico/dia?data='+encodeURIComponent(data));
    const anteriores = (dias||[]).map(x=>x.data).filter(x=>x && x<data).sort().reverse();
    let ant = null;
    if(anteriores.length){ try{ ant = await this.api('/api/historico/dia?data='+encodeURIComponent(anteriores[0])); }catch(e){} }
    const [a,m,d] = data.split('-').map(Number);
    const perfilAtivo = this._cru ? this._cru.perfilAtivo : '';
    // "agora" = fim daquele dia (senão os tempos de rota sairiam contando até hoje)
    this._cru = { hoje: dia, ontem: ant, perfilAtivo, agora: new Date(a, m-1, d, 23, 59) };
    return this.montar();
  },
  // resolve CEP -> cidade (em segundo plano; usa o mesmo resolvedor do painel)
  async resolverCidades(){
    const c=this._cru; if(!c) return null;
    const ceps=[...new Set([...linhasDe(c.hoje.SLA),...linhasDe(c.hoje.DS)].map(r=>r['Postal Code']).filter(Boolean))].filter(x=>!(x in this.cepMap));
    if(!ceps.length) return null;
    let mapa=null;
    try{ const m=await import('./cepresolver.js'); mapa=await m.resolveCepsToCities(ceps, ()=>{}); }catch(e){ mapa=await resolverCepsViaCep(ceps); }
    this.cepMap={...this.cepMap,...mapa};
    return this.montar();
  },
  async atualizar(aoProgredir, etapas){
    const antes = await this.api('/api/progresso');
    const t0 = antes && antes.horario ? antes.horario : '';
    await this.api('/api/atualizar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(etapas && etapas.length && etapas.length<ETAPAS.length ? { etapas } : {}) });
    let maior=0, semNovidade=0; const inicio=Date.now();
    while(Date.now()-inicio < 20*60*1000){
      await new Promise(r=>setTimeout(r,1500));
      const e = await this.api('/api/progresso');
      if(!e || !e.horario || e.horario<=t0){ if(++semNovidade>16) throw new Error('O PC não iniciou a atualização (já tem uma em andamento ou faltam BRs importados no SLA).'); continue; }
      semNovidade=0;
      const [a1,a2] = e.args||[];
      if(e.acao==='erro') throw new Error(a1||'A atualização deu erro no PC.');
      if(e.acao==='atualizar'){ if(typeof a1==='number'&&a1>maior) maior=a1; aoProgredir(maior, a2||''); }
      else if(e.acao==='mostrar'){ aoProgredir(maior, a1||'Iniciando...'); }
      else if(e.acao==='concluir'){ aoProgredir(100, a1||'Atualização concluída!'); return; }
    }
    throw new Error('A atualização demorou demais — confira o PC.');
  },
};
async function resolverCepsViaCep(ceps){
  const mapa={}; const fila=[...ceps];
  await Promise.all(Array.from({length:6},async()=>{
    while(fila.length){
      const cep=fila.pop();
      try{ const r=await fetch(`https://viacep.com.br/ws/${String(cep).replace(/\D/g,'')}/json/`); const j=await r.json(); mapa[cep]= j&&!j.erro ? `${j.localidade} - ${j.uf}` : 'CEP não encontrado'; }
      catch(e){ mapa[cep]='CEP não encontrado'; }
    }
  }));
  return mapa;
}

/* ==========================================================
   GRÁFICOS (SVG feito à mão — sem depender de internet)
   ========================================================== */
function suave(pts){ // curva suave (Catmull-Rom -> Bézier)
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6];
    const c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}
function escalaBoa(maxDado){
  const passos=[1,2,5,10,20,25,50,100,200,250,500,1000,2000,2500,5000,10000];
  const alvo=Math.max(maxDado,1)*1.05;
  const step=passos.find(p=>alvo/p<=6)||20000;
  return { step, max: Math.ceil(alvo/step)*step };
}
function graficoArea(h){
  const W=340,H=190,L=38,R=8,T=8,B=24, iw=W-L-R, ih=H-T-B;
  const {step, max} = escalaBoa(Math.max(...h.entregues,...h.pickup));
  const x=i=>L+iw*i/(h.labels.length-1), y=v=>T+ih-(v/max)*ih;
  let g='';
  for(let v=0; v<=max; v+=step){
    g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--grid)" stroke-width="1"/>`;
    g+=`<text x="${L-6}" y="${y(v)+3}" font-size="8.5" style="fill:var(--muted2)" text-anchor="end">${v===0?'0':v.toLocaleString('pt-BR')}</text>`;
  }
  const serie=(dados,cor,op)=>{
    const pts=dados.map((v,i)=>[x(i),y(v)]);
    const linha=suave(pts);
    return `<path d="${linha} L${x(dados.length-1)},${y(0)} L${x(0)},${y(0)} Z" fill="${cor}" fill-opacity="${op}"/><path d="${linha}" fill="none" stroke="${cor}" stroke-width="1.6"/>`;
  };
  const lab=h.labels.map((t,i)=>`<text x="${x(i)}" y="${H-8}" font-size="7.4" style="fill:var(--muted2)" text-anchor="middle">${t}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Entregues vs Pick Up por hora">${g}${serie(h.pickup,'#f3b13a',.32)}${serie(h.entregues,'#1fa75a',.28)}${lab}</svg>`;
}
function graficoBarras(dist){
  const W=340,H=210,L=30,R=8,T=16,B=44, iw=W-L-R, ih=H-T-B;
  const {step, max} = escalaBoa(Math.max(...dist, 5));
  const cores=['#1fa75a','#f3b13a','#e5384c','#8d8286'];
  const nomes=[['Tranquilo','(+3 dias)'],['Atenção','(1 a 3 dias)'],['Urgente','(menos de 1 dia)'],['Vencido','']];
  const y=v=>T+ih-(v/max)*ih;
  let g='';
  for(let v=0; v<=max; v+=step){
    g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--grid)"/><text x="${L-6}" y="${y(v)+3}" font-size="9" style="fill:var(--muted2)" text-anchor="end">${v}</text>`;
  }
  const bw=iw/4;
  const bars=dist.map((v,i)=>{
    const cx=L+bw*i+bw/2, w=Math.min(34,bw*.62), alt=Math.max(v>0?3:0,(v/max)*ih);
    return `<rect x="${cx-w/2}" y="${T+ih-alt}" width="${w}" height="${alt}" rx="2.5" fill="${cores[i]}"/>`+
      `<text x="${cx}" y="${T+ih-alt-5}" font-size="9.5" font-weight="700" style="fill:var(--t2)" text-anchor="middle">${v}</text>`+
      `<text x="${cx}" y="${H-24}" font-size="9.5" style="fill:var(--t2)" text-anchor="middle">${nomes[i][0]}</text>`+
      `<text x="${cx}" y="${H-12}" font-size="8.5" style="fill:var(--muted2)" text-anchor="middle">${nomes[i][1]}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Distribuição de urgência dos PNRs">${g}${bars}</svg>`;
}

async function copiar(texto){
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(texto); return true; } }catch(e){}

// escolhe sozinho, ou pergunta qual usar se tiver os dois). Sem telefone cadastrado,
// abre o WhatsApp só com a mensagem pronta pra você escolher o contato.

function _notificarReal(nome, tel, msg){
  if(tel){ whats(tel, msg); return; }
  if(!nome || /^sem respons/i.test(nome)){ whats(null, msg); return; }
  const f = document.createElement('div'); f.className='fundo';
  f.innerHTML = `<div class="sheet"><div class="grip"></div><h3>WhatsApp de ${esc(primeiroNomeBonito(nome))}</h3>
    <div class="sb">Ainda não tenho o número de <b>${esc(nome)}</b>. Digite uma vez com DDD — fica guardado (também no PC) e da próxima abre direto na conversa.</div>
    <label class="campo">${ic('phone')}<input id="fone-in" type="tel" inputmode="tel" placeholder="(98) 99999-9999" autocomplete="off"></label>
    <button class="btn" data-x="salvar">${ic('wpp')} Salvar e abrir WhatsApp</button>
    <button class="btn sec" data-x="sem" style="margin-top:10px;padding:14px;font-size:15px">Abrir sem número</button></div>`;
  document.body.appendChild(f);
  setTimeout(()=>f.querySelector('#fone-in')?.focus(), 200);
  f.addEventListener('click', e=>{
    if(e.target===f){ f.remove(); return; }
    const b = e.target.closest('[data-x]'); if(!b) return;
    if(b.dataset.x==='sem'){ f.remove(); whats(null, msg); return; }
    const fone = normFone(f.querySelector('#fone-in').value);
    if(!fone){ toast('Número inválido — digite com DDD (ex: 98 99999-9999)'); return; }
    f.remove();
    whats(fone, msg);                                   // abre já (dentro do toque)
    const alvo = semAcento(nome);
    [...(S.dados?.pnr?.lista||[]), ...(S.dados?.drivers||[])].forEach(x=>{ if(semAcento(x.driver||x.nome||'')===alvo) x.telefone = fone; });
    Promise.resolve(Fonte.salvarContato(nome, fone)).then(ok=>toast(ok ? 'Número guardado no PC e no celular' : 'Número guardado no celular'));
  });
}
function _whatsReal(tel, msg){
  const fone = tel ? String(tel).replace(/\D/g,'') : '';
  const texto = encodeURIComponent(msg);
  if(!fone) toast('Sem telefone cadastrado — escolha o contato no WhatsApp');
  const app = `whatsapp://send?${fone ? `phone=${fone}&` : ''}text=${texto}`;
  const web = `https://wa.me/${fone}?text=${texto}`;
  if(emWebView){
    // 1) Jeito garantido: a "ponte" do app Android (MainActivity) abre o WhatsApp instalado
    //    — o normal ou o Business (se tiver os dois, o Android pergunta qual).
    const ponte = window.AndroidXPT;
    if(ponte && typeof ponte.abrir === 'function'){
      let ok = false;
      try{ ok = ponte.abrir(app); }catch(e){}
      if(!ok){ try{ ok = ponte.abrir(web); }catch(e){} }   // sem app instalado: cai no link web
      if(ok) return;
    }
    // 2) App antigo (sem a ponte): tenta o esquema whatsapp:// num iframe escondido
    const f = document.createElement('iframe');
    f.style.cssText = 'display:none;width:0;height:0;border:0';
    f.src = app;
    document.body.appendChild(f);
    setTimeout(()=>f.remove(), 3000);
  } else {
    // No navegador do celular (iPhone, Chrome...): o link do WhatsApp abre o app instalado
    window.open(web, '_blank');
  }
}

/* ---- Backlog (pacotes parados) ---- */
const BK_AGING = ['Sem atraso','1 a 3 dias','3 a 6 dias','Mais de 6 dias'];
const bkDiasTxt = raw => { const v=(raw==null?'':String(raw)).trim()||'0'; return `${v} ${parseFloat(v)===1?'dia parado':'dias parados'}`; };
function bkFiltrar(comBusca=true){
  const f=S.bk; let r=S.dados.backlog.lista;
  if(f.status) r=r.filter(x=>x.status===f.status);
  if(f.driver) r=r.filter(x=>x.driver===f.driver);
  if(f.cidade) r=r.filter(x=>x.cidade===f.cidade);
  if(f.aging!==null) r=r.filter(x=>x.aging===f.aging);
  const t=f.busca.trim().toLowerCase();
  if(comBusca && t) r=r.filter(x=>x.br.toLowerCase().includes(t)||x.driver.toLowerCase().includes(t));
  return [...r].sort((a,b)=>b.aging-a.aging||b.dias-a.dias);
}
function bkFiltroTxt(){
  const f=S.bk, t=f.busca.trim().toLowerCase();
  return [f.cidade,f.driver,f.status,f.aging!==null?BK_AGING[f.aging]:'',t?`busca "${t}"`:''].filter(Boolean).join(' · ');
}
// mesmo texto do "Copiar resumo das BRs" do painel do PC
function bkResumoTxt(rows){
  const crit=rows.filter(x=>x.aging===3).length, filtro=bkFiltroTxt();
  return `Backlog em Aberto${filtro?' - '+filtro:''}\n\nTotal: ${rows.length} pacote(s) parado(s), sendo ${crit} com mais de 6 dias\n\n${rows.map(x=>`- ${x.br} / ${x.cidade||'Sem cidade'} / ${bkDiasTxt(x.diasRaw)}`).join('\n')}\n\nTratar o quanto antes para reduzir o backlog.`;
}
// mesmo texto do relatório TXT do Backlog do painel (números do que está filtrado)
function bkRelatorioTxt(rows){
  const sem=rows.filter(x=>x.tentativas<=0).length, crit=rows.filter(x=>x.aging===3).length;
  return `🏛️ XPT: ${S.dados.estacao||'Todas as estações'}\n\n📦 Total Parado (Backlog): ${rows.length}\n🕐 Sem Tentativa: ${sem}\n✅ Já Tentados: ${rows.length-sem}\n🔴 Aging Crítico: ${crit}`;
}
function bkCidadeTxt(cidade, rows){
  const crit=rows.filter(x=>x.aging===3).length, ord=[...rows].sort((a,b)=>b.dias-a.dias);
  return `Backlog em Aberto - ${cidade}\n\nTotal: ${rows.length} pacote(s) parado(s), sendo ${crit} com mais de 6 dias\n\n${ord.map(x=>`- ${x.br} | ${x.driver||'Sem responsável'} | ${x.diasRaw||'0'} dias`).join('\n')}\n\nTratar o quanto antes para reduzir o backlog.`;
}
function bkEntregadorTxt(nome, rows){
  const crit=rows.filter(x=>x.aging===3).length, sem=rows.filter(x=>x.tentativas<=0).length;
  return `*ATENÇÃO - PACOTES EM BACKLOG*\n\n${primeiroNomeBonito(nome)},\n\nVocê tem ${rows.length} pacote(s) parado(s) no backlog.\n\nMais de 6 dias parados: ${crit}\nSem nenhuma tentativa de entrega: ${sem}\n\nPrecisamos da sua atenção para resolver esses pacotes o quanto antes.`;
}
function bkItens(){
  const rows=bkFiltrar(true), lim=S.bk.limite, mostra=rows.slice(0,lim);

  </button>`).join('') + (rows.length>lim ? `<button class="btn sec" data-a="bk-mais" style="margin:4px 0 10px;padding:13px;font-size:14px">Mostrar mais (${rows.length-lim} restantes)</button>` : '');
}

      <div class="kpi"><div class="cab"><span class="q vm">${ic('warn')}</span><span class="l">Aging crítico</span></div><div class="v ${crit?'c-verm':''}">${fInt(crit)}</div></div>

    <div class="chips" style="padding-bottom:6px">
      ${sel('bk-status',f.status,'Todos os status',st)}${sel('bk-driver',f.driver,'Todos os entregadores',dr)}${sel('bk-cidade',f.cidade,'Todas as cidades',ci)}

    </div>
    <div class="bk-nota" id="bk-nota">${fInt(bkFiltrar(true).length)} pacote(s) na lista. Toque num pacote para copiar o código BR.</div>
    <div id="bk-lista">${bkItens()}</div>
  </div>`;
}

/* ---- Histórico (dias anteriores) ---- */
const fmtDataBR = d => { const [a,m,dd]=d.split('-'); return `${dd}/${m}/${a}`; };
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function diaSemana(d){ const [a,m,dd]=d.split('-').map(Number); const t=new Date(a,m-1,dd).toLocaleDateString('pt-BR',{weekday:'long'}); return t.charAt(0).toUpperCase()+t.slice(1); }
const hojeISO = () => { const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; };
function faixaHist(){
  if(!S.hist) return '';
  return `<div class="faixa-hist"><i>${ic('cal')}</i><span>Vendo ${esc(fmtDataBR(S.hist))}</span><button data-a="hist-hoje">Voltar para hoje</button></div>`;
}
function vHistorico(){
  const dias = S.histDias || [];
  const hoje = hojeISO();
  const lista = dias.length ? dias.map(x=>{
    const [a,m,dd]=x.data.split('-');
    const ehHoje = x.data===hoje;
    return `<button class="hist-dia ${S.hist===x.data?'on':''}" data-a="hist-dia" data-d="${esc(x.data)}">
      <span class="cal"><b>${dd}</b><span>${MESES[+m-1]}</span></span>
      <span class="tx"><b>${esc(diaSemana(x.data))}${ehHoje?'<span class="hoje">Hoje</span>':''}</b><small>${esc(fmtDataBR(x.data))}</small>
        <span class="tps">${(x.tipos||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</span></span>
      <span class="ch">${ic('chevR')}</span></button>`;
  }).join('') : `<div class="vazio">Nenhum dia salvo ainda. O histórico é criado sozinho a cada atualização.</div>`;
  return `${topoVinho('Histórico','back','')}<div class="folha" style="padding-top:14px">
    <div class="hist-dica">Toque num dia para ver os números daquele dia (SLA, DS, entregadores e PNR). O histórico guarda os últimos 30 dias.</div>
    ${lista}
  </div>`;
}

function pnrFiltrados(){
  const p=S.pnr, b=p.busca.trim().toLowerCase();
  return S.dados.pnr.lista.filter(x=>{
    if(p.status && x.status!==p.status) return false;
    if(p.cidade && x.cidade!==p.cidade) return false;
    if(b && !(x.id.toLowerCase().includes(b)||x.driver.toLowerCase().includes(b))) return false;
    return true; // (a lista já contém só os abertos; "Em aberto" é o padrão do filtro)
  });
}

async function abrirHistorico(){
  S.telaAntes = S.tela==='historico' ? S.telaAntes : S.tela;
  try{ S.histDias = await Fonte.listarDias(); }
  catch(e){ toast((e&&e.codigo==='pin') ? 'PIN incorreto ou trocado no PC' : 'Não consegui buscar o histórico'); return; }

async function verDia(data){
  if(data===hojeISO()){ voltarHoje(); return; }
  toast('Carregando '+fmtDataBR(data)+'...');
  try{
    S.dados = await Fonte.carregarDia(data, S.histDias);
    S.hist = data; S.visao='op'; S.telaAntes='inicio'; ir('inicio'); segundoPlano();
    toast('Mostrando '+fmtDataBR(data));
  }catch(e){ toast('Não consegui carregar esse dia'); }
}
async function voltarHoje(){
  try{ S.dados = await Fonte.carregar(); ultimaCarga=Date.now(); S.hist=null; S.visao='op'; ir('inicio'); segundoPlano(); toast('Voltou para hoje'); }
  catch(e){ toast('Não consegui buscar os dados de hoje'); }
}
function renderMantendoScroll(){ const y=window.scrollY; render(); window.scrollTo(0,y); }
function ir(t){
  if(t.startsWith('pnr') && S.visao!=='pnr') S.visao='pnr';
  if(['inicio','entregas','backlog','premium','alertas','perfil','historico'].includes(t) && S.visao!=='op') S.visao='op';
  S.tela=t; render();
}
let ultimaCarga = 0;
async function iniciarApp(){
  S.fase='carregando'; render();
  try{
    S.dados = await Fonte.carregar();
  }catch(e){
    if(e.codigo==='pin'){ LS.del('xpt_pin'); Fonte.pin=null; S.fase='login'; render(); toast('PIN incorreto ou trocado no PC'); return; }
    S.erro = (e && e.message) || 'Erro desconhecido'; S.erroCodigo = (e && e.codigo) || ''; S.fase='erro'; render(); return;
  }
  ultimaCarga = Date.now();
  S.hist=null; S.fase='app'; S.tela='inicio'; S.visao='op'; render();
  segundoPlano();
}
// cidades (CEP -> cidade) demoram na 1ª vez: resolve em segundo plano e refaz a tela
async function segundoPlano(){
  try{
    const novo = await Fonte.resolverCidades();
    if(novo && S.fase==='app'){ S.dados = novo; if(!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) render(); }
  }catch(e){ /* sem cidades: segue com "—" */ }
}
// volta pro app depois de um tempo: busca de novo, sem piscar
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState!=='visible' || S.fase!=='app' || S.atualizando || S.hist || Fonte.modo!=='real') return;
  if(Date.now()-ultimaCarga < 90*1000) return;
  try{ const n = await Fonte.carregar(); ultimaCarga=Date.now(); S.dados=n; if(!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) render(); segundoPlano(); }catch(e){}
});

document.addEventListener('click', async e=>{
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a;
  if(a==='entrar-app'){
    if(Fonte.modo==='real'){ if(Fonte.pin){ iniciarApp(); } else { S.fase='login'; render(); } }
    else if(LS.get('xpt_lembrar')==='1'){ iniciarApp(); } else { S.fase='login'; render(); }
  }
  else if(a==='ver-senha'){ const i=$('#lg-pass')||$('#lg-pin'); i.type = i.type==='password'?'text':'password'; }
  else if(a==='esqueci'){ toast('Peça a redefinição da senha ao administrador'); }
  else if(a==='como-conectar'){ abrirAjudaPin(); }
  else if(a==='fazer-login'){
    if(Fonte.modo==='real'){
      const pin=$('#lg-pin').value.trim();
      if(!/^\d{6}$/.test(pin)){ $('#lg-erro').textContent='O PIN tem 6 dígitos.'; return; }
      $('#lg-erro').textContent='Conferindo o PIN...';
      try{
        if(!(await Fonte.validarPin(pin))){ $('#lg-erro').textContent='PIN incorreto.'; return; }
      }catch(err){ $('#lg-erro').textContent = (err && err.codigo==='licenca') ? err.message : 'Não consegui falar com o PC. Confira a rede.'; return; }
      if($('#lg-lembrar').checked) LS.set('xpt_pin',pin); else LS.del('xpt_pin');
      iniciarApp();
    } else {
      const u=$('#lg-user').value.trim(), sn=$('#lg-pass').value;
      if(!u||!sn){ $('#lg-erro').textContent='Preencha usuário e senha.'; return; }
      if($('#lg-lembrar').checked){ LS.set('xpt_lembrar','1'); LS.set('xpt_user',u); } else { LS.del('xpt_lembrar'); }
      iniciarApp();
    }
  }
  else if(a==='acesso-pin'){
    const pin = prompt('Digite o PIN mostrado no PC (Acesso pelo Celular):');
    if(pin===null) return;
    if(await Fonte.validarPin(pin.trim())){ LS.set('xpt_lembrar','1'); iniciarApp(); } else { toast('PIN inválido'); }
  }
  else if(a==='painel-completo'){ location.href = '/' + (Fonte.pin ? '?pin='+encodeURIComponent(Fonte.pin) : ''); }
  else if(a==='trocar-pc'){ history.back(); }
  else if(a==='tentar-de-novo'){ iniciarApp(); }
  else if(a==='tema-alt'){ TEMA.modo = TEMA.modo==='escuro' ? 'claro' : 'escuro'; salvarTema(); aplicarTema(); renderMantendoScroll(); }
  else if(a==='ir'){ ir(el.dataset.t); }
  else if(a==='ir-ent'){ S.ent.filtro=el.dataset.f; ir('entregas'); }
  else if(a==='voltar'){ ir(S.tela==='historico' ? (S.telaAntes||'inicio') : S.tela==='pnr-detalhe'?'pnr-lista':(S.visao==='pnr'?'pnr-resumo':'inicio')); }
  else if(a==='bk-aging'){ S.bk.aging = el.dataset.i==='' ? null : +el.dataset.i; S.bk.limite=50; renderMantendoScroll(); }
  else if(a==='bk-limpar'){ S.bk={ status:'', driver:'', cidade:'', aging:null, busca:'', limite:50 }; renderMantendoScroll(); }
  else if(a==='bk-mais'){ S.bk.limite+=50; $('#bk-lista').innerHTML=bkItens(); }
  else if(a==='bk-copiar-br'){ copiar(el.dataset.br).then(ok=>toast(ok?`${el.dataset.br} copiado`:'Não consegui copiar')); }
  else if(a==='bk-resumo'){ const r=bkFiltrar(true); if(!r.length){ toast('Nenhum pacote no filtro atual pra copiar'); return; } copiar(bkResumoTxt(r)).then(ok=>toast(ok?`Resumo de ${r.length} pacote${r.length===1?'':'s'} copiado — já pode colar`:'Não consegui copiar')); }
  else if(a==='bk-relatorio'){ const r=bkFiltrar(true); if(!r.length){ toast('Nenhum pacote no filtro atual pra copiar'); return; } copiar(bkRelatorioTxt(r)).then(ok=>toast(ok?'Relatório copiado — já pode colar':'Não consegui copiar')); }
  else if(a==='bk-zap'){ const r=bkFiltrar(true); if(!r.length){ toast('Nenhum pacote no filtro atual'); return; } whats(null, bkResumoTxt(r)); }
  else if(a==='bk-cidade-msg'){ const r=bkFiltrar(true); if(!r.length){ toast('Nenhum pacote no filtro atual'); return; } copiar(bkCidadeTxt(S.bk.cidade, r)).then(ok=>toast(ok?`Resumo de ${S.bk.cidade} copiado — já pode colar`:'Não consegui copiar')); }
  else if(a==='bk-notif'){ const r=bkFiltrar(true); if(!r.length){ toast('Nenhum pacote no filtro atual'); return; } const nome=S.bk.driver, tel=(r.find(x=>x.telefone)||{}).telefone||null; notificar(nome, tel, bkEntregadorTxt(nome, r)); }
  else if(a==='ir-filtros'){ $('#pnr-busca')?.focus(); }

  else if(a==='pnr-enviar'){

  const {perfis=[], ativo, comLogin=[]} = dados||{};
  const f=document.createElement('div'); f.className='fundo';
  const lista = () => `<div class="sheet"><div class="grip"></div><h3>Perfis do PC</h3><div class="sb">Toque num perfil para usar. A lixeira apaga o login e a lista de BRs dele.</div>
    ${perfis.length ? perfis.map(p=>`<div class="perfil-linha"><button class="btn ${p===ativo?'':'sec'}" data-p="${esc(p)}">${esc(p)}${p===ativo?' ✓':''}${comLogin.includes(p)?'':' (sem login)'}</button><button class="lixo" data-del="${esc(p)}" aria-label="Apagar ${esc(p)}">${ic('trash')}</button></div>`).join('') : '<div class="vazio">Nenhum perfil cadastrado no PC.</div>'}
  </div>`;
  f.innerHTML = lista();
  document.body.appendChild(f);
  f.addEventListener('click', async ev=>{
    if(ev.target===f){ f.remove(); return; }
    const del = ev.target.closest('[data-del]');
    if(del){
      const nome = del.dataset.del;
      f.innerHTML = `<div class="sheet"><div class="grip"></div><h3>Apagar perfil?</h3>
        <div class="sb">Apagar <b>${esc(nome)}</b> do PC? Isso apaga o login do SPX salvo nele e a lista de BRs dele. O histórico dos dias fica guardado. Não dá pra desfazer.${nome===ativo?' <b>Esse é o perfil em uso</b>: o painel passa pra outro perfil.':''}</div>
        <button class="btn perigo" data-x="apagar" data-nome="${esc(nome)}" style="margin-top:6px;padding:14px;font-size:15px">${ic('trash')} Sim, apagar</button>
        <button class="btn sec" data-x="voltar" style="margin-top:10px;padding:14px;font-size:15px">Cancelar</button></div>`;
      return;
    }
    const x = ev.target.closest('[data-x]');
    if(x && x.dataset.x==='voltar'){ f.remove(); abrirPerfis(); return; }
    if(x && x.dataset.x==='apagar'){
      const nome = x.dataset.nome; x.disabled = true; x.textContent = 'Apagando...';
      let r; try{ r = await Fonte.apagarPerfil(nome); }catch(e){ r = { ok:false, erro:(e&&e.codigo==='pin') ? 'PIN incorreto ou trocado no PC' : 'Não consegui falar com o PC' }; }
      f.remove();
      if(!r || !r.ok){ toast((r&&r.erro) || 'Não consegui apagar o perfil'); return; }
      toast(`Perfil "${nome}" apagado`);
      if(r.eraOAtivo || nome===S.perfil){
        S.perfil = r.ativo || S.perfil;
        try{ S.dados = await Fonte.carregar(); ultimaCarga = Date.now(); render(); segundoPlano(); }catch(e){ /* sem dados ainda nesse perfil */ }
      }
      abrirPerfis();
      return;
    }
    const b = ev.target.closest('[data-p]'); if(!b) return;
    const nome=b.dataset.p; f.remove();
    if(nome===ativo) return;
    try{ await Fonte.trocarPerfil(nome); S.dados=await Fonte.carregar(); ultimaCarga=Date.now(); render(); toast('Perfil ativo: '+nome); segundoPlano(); }
    catch(e){ toast('Não consegui trocar de perfil'); }
  });
}

function abrirEtapas(){
  if(S.atualizando) return;
  const f = document.createElement('div'); f.className='fundo';
  f.innerHTML = `<div class="sheet"><div class="grip"></div><h3>O que atualizar?</h3><div class="sb">Marque só o que você precisa — assim é bem mais rápido.</div>
    <label class="etp todos"><input type="checkbox" class="chk" id="etp-todos"> Todos</label>
    <div class="etp-sep"></div>
    ${ETAPAS.map(([k,nome])=>`<label class="etp"><input type="checkbox" class="chk etp-i" data-e="${k}" ${S.etapas.includes(k)?'checked':''}> ${nome}</label>`).join('')}
    <button class="btn" data-x="ok" style="margin-top:16px;padding:15px;font-size:16px">${ic('refresh')} Atualizar</button></div>`;
  document.body.appendChild(f);
  const todos = f.querySelector('#etp-todos'), itens = [...f.querySelectorAll('.etp-i')];
  const sincroniza = () => { todos.checked = itens.every(i=>i.checked); };
  sincroniza();
  todos.addEventListener('change', ()=>itens.forEach(i=>i.checked=todos.checked));
  itens.forEach(i=>i.addEventListener('change', sincroniza));
  f.addEventListener('click', e=>{
    if(e.target===f){ f.remove(); return; }
    if(!e.target.closest('[data-x=ok]')) return;
    const marcadas = itens.filter(i=>i.checked).map(i=>i.dataset.e);
    if(!marcadas.length){ toast('Marque pelo menos uma etapa'); return; }
    S.etapas = marcadas; LS.set('xpt_etapas', JSON.stringify(marcadas));
    f.remove(); atualizar(marcadas);
  });
}
async function atualizar(etapas){
  if(S.atualizando) return; S.atualizando=true;
  const btn=$('#btn-atualizar'); btn.classList.add('rod'); $('#atz-txt').textContent='Atualizando...';
  try{
    await Fonte.atualizar((p,t)=>{ const fl=$('#atz-fill'); if(fl) fl.style.width=p+'%'; const st=$('#atz-status'); if(st) st.textContent=`${p}% — ${t}`; }, etapas || S.etapas);
    S.dados = await Fonte.carregar(); ultimaCarga=Date.now(); toast('Dados atualizados!'); segundoPlano();
  }catch(e){
    if(e.codigo==='pin'){ toast('PIN incorreto ou trocado no PC'); } else { toast((e&&e.message)||'Não consegui atualizar'); }
  }
  S.atualizando=false;
  if(['alertas','inicio'].includes(S.tela)) render();
}

function graficoDs(h){
  const W=340,H=190,L=38,R=8,T=8,B=24, iw=W-L-R, ih=H-T-B;
  const {step, max} = escalaBoa(Math.max(...h.valores));
  const y=v=>T+ih-(v/max)*ih, bw=iw/h.labels.length;
  let g='';
  for(let v=0; v<=max; v+=step){
    g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--grid)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" font-size="8.5" style="fill:var(--muted2)" text-anchor="end">${v===0?'0':v.toLocaleString('pt-BR')}</text>`;
  }
  const barras=h.valores.map((v,i)=>{ const w=bw*.62, x=L+bw*i+(bw-w)/2, alt=Math.max(v>0?1.5:0,(v/max)*ih); return `<rect x="${x}" y="${T+ih-alt}" width="${w}" height="${alt}" rx="2" fill="#1fa75a" fill-opacity=".85"/>`; }).join('');
  const lab=h.labels.map((t,i)=>`<text x="${L+bw*i+bw/2}" y="${H-8}" font-size="7.2" style="fill:var(--muted2)" text-anchor="middle">${t}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Entregas DS por hora">${g}${barras}${lab}</svg>`;
}

function mostrarPrevia(msg){
  const f=document.createElement('div'); f.className='fundo';
  f.innerHTML=`<div class="sheet"><div class="grip"></div><h3>Mensagem pronta</h3><div class="sb">É assim que a mensagem chega no WhatsApp. Na versão Premium, este botão abre direto a conversa com o entregador.</div><pre class="previa">${esc(msg)}</pre>

  document.body.appendChild(f);
  f.addEventListener('click', e=>{
    if(e.target===f){ f.remove(); return; }
    const x=e.target.closest('[data-x]'); if(!x) return;
    if(x.dataset.x==='copiar'){ copiar(msg).then(ok=>toast(ok?'Mensagem copiada':'Não consegui copiar')); return; }
    f.remove();
  });
}

});
